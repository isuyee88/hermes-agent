    - HERMES_CLOUDFLARE_AI_GATEWAY_PROVIDERS
    - CLOUDFLARE_AI_GATEWAY_BASE_URL
    - CLOUDFLARE_API_TOKEN
    - CLOUDFLARE_AI_GATEWAY_API_KEY
    - CLOUDFLARE_AI_GATEWAY_ROUTE_GENERAL
    - CLOUDFLARE_AI_GATEWAY_ROUTE_CODING
    - CLOUDFLARE_AI_GATEWAY_ROUTE_CREATIVE
    - CLOUDFLARE_AI_GATEWAY_ROUTE_IMAGE
