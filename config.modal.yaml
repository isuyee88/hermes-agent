    - FIRECRAWL_API_KEY
    - FIRECRAWL_API_URL
    - PARALLEL_API_KEY
    - TAVILY_API_KEY
    - EXA_API_KEY
    - BROWSERBASE_API_KEY
    - BROWSERBASE_PROJECT_ID
    - BROWSER_USE_API_KEY
    - FIRECRAWL_BROWSER_SESSION_TTL
    - CAMOFOX_URL
    - HASS_URL
    - HASS_TOKEN
    - API_SERVER_ENABLED
    - API_SERVER_KEY
    - API_SERVER_PORT
    - API_SERVER_HOST
    - FEISHU_APP_ID
    - FEISHU_APP_SECRET
    - FEISHU_DOMAIN
    - FEISHU_CONNECTION_MODE
    - FEISHU_ENCRYPT_KEY
    - FEISHU_VERIFICATION_TOKEN
