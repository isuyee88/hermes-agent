    - HERMES_MODAL_CHAT_QUEUE_WORKER_CPU
    - HERMES_MODAL_CRON_QUEUE_MAX_JOBS_PER_WORKER
  modal_image: "nikolaik/python-nodejs:python3.11-nodejs20"
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true

memory:
  provider: supermemory

skills:
  startup:
    - affiliate-os
    - browser-ops
  platform_startup:
    cli:
      - automation-os
      - ceo-os
    feishu:
      - feishu-workbench
      - affiliate-os
      - browser-ops
    api_server:
      - ship
      - gov

plugins:
  enable_project: true

platform_toolsets:
  cli:
    - founder-max
    - feishu
    - plugin_startup_ops
  telegram:
    - collab-safe
  qq:
    - collab-safe
  feishu:
    - collab-safe
    - feishu
  api_server:
    - cto-max
    - plugin_startup_ops

telegram:
  require_mention: false
  reactions: false
  free_response_chats:
    - "private"

platforms:
  telegram:
    enabled: true
    reply_to_mode: first
  qq:
    enabled: false
    extra:
      connection_mode: webhook
      webhook_path: /qq/webhook
  feishu:
    enabled: false
    extra:
      connection_mode: webhook
      webhook_path: /feishu/webhook
